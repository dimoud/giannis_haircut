name: Δημοσίευση ιστότοπου
# Τρέχει: (α) σε κάθε push στο main, (β) όταν ο Πίνακας διαχείρισης πατήσει «Δημοσίευση» (workflow_dispatch).
# Με τα μυστικά DEDOMENA_URL και DEDOMENA_KLEIDI, το περιεχόμενο έρχεται από το Φύλλο Google· αλλιώς από το αποθετήριο.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow
      - id: pages
        uses: actions/configure-pages@v5
      - name: Κρυφή μνήμη φωτογραφιών από το Drive
        uses: actions/cache@v4
        with:
          path: .cache/meson
          key: meson-${{ github.run_id }}
          restore-keys: meson-
      - name: Περιεχόμενο από τον Πίνακα διαχείρισης
        id: fyllo
        env:
          DEDOMENA_URL: ${{ secrets.DEDOMENA_URL }}
          DEDOMENA_KLEIDI: ${{ secrets.DEDOMENA_KLEIDI }}
        run: |
          if [ -z "$DEDOMENA_URL" ] || [ -z "$DEDOMENA_KLEIDI" ]; then echo "pigi=repo" >> "$GITHUB_OUTPUT"; exit 0; fi
          for i in 1 2 3; do
            if python3 build/fere_apo_fyllo.py --url "$DEDOMENA_URL" --kleidi "$DEDOMENA_KLEIDI" --dedomena _dedomena --meson .cache/meson; then
              echo "pigi=fyllo" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "::warning::Το Φύλλο δεν διαβάστηκε (προσπάθεια $i/3)"; sleep $((i * 20))
          done
          echo "::error::Το Φύλλο δεν διαβάστηκε· μένει online η προηγούμενη έκδοση."; exit 1
      - name: Παραγωγή στατικού HTML (ελληνικά και αγγλικά)
        run: |
          if [ "${{ steps.fyllo.outputs.pigi }}" = "fyllo" ]; then EXTRA="--dedomena _dedomena --meson .cache/meson"; else EXTRA=""; fi
          python3 build/build.py $EXTRA --out _site --base "${{ steps.pages.outputs.base_path }}" --tomeas "${{ steps.pages.outputs.base_url }}"
      - name: Έλεγχος πριν ανέβει
        run: python3 build/elegxos.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
