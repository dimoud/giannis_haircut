<!doctype html>
<html lang="el">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--ink:#14100b;--ink2:#1c1711;--cream:#f1ece2;--cream2:#e7dfd1;--cu:#7a5a12;--cud:#d9b44a;--fg2:#4a4238;--line:rgba(20,16,11,.14);--r:16px;--slot:22px}
*{box-sizing:border-box}html,body{margin:0}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--cream);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:400;margin:0}
.kef{position:sticky;top:0;z-index:20;background:var(--ink);color:var(--cream);display:flex;align-items:center;gap:12px;padding:10px 16px}
.kef h1{font-style:italic;font-size:24px}.kef small{color:var(--cud);font-size:12px}
.kef .xoros{flex:1}
.kart{display:flex;gap:4px;overflow-x:auto;background:var(--ink2);padding:0 8px;position:sticky;top:52px;z-index:19}
.kart button{background:none;border:0;color:rgba(241,236,226,.75);padding:12px 14px;min-height:44px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;font-weight:600}
.kart button[aria-selected=true]{color:var(--cream);border-color:var(--cud)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--cud);color:var(--ink);font-size:12px;margin-left:4px}
main{padding:16px;max-width:1200px;margin:0 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:999px;border:0;background:var(--cu);color:var(--cream);font-weight:700;cursor:pointer}
.btn.deyt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.kindynos{background:#8c2a17}
.btn:disabled{opacity:.5;cursor:default}
.seira{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.nav-im{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.nav-im h2{font-size:22px;flex:1;text-align:center}
.nav-im button{min-width:44px;min-height:44px;border-radius:50%;border:0;background:var(--cream2);cursor:pointer;font-size:18px}
.plegma{display:grid;grid-template-columns:48px repeat(var(--k),minmax(130px,1fr));overflow-x:auto;background:#fff;border-radius:var(--r);box-shadow:0 1px 0 var(--line)}
.stili{position:relative;border-left:1px solid var(--line)}
.stili-k{position:sticky;top:0;background:#fff;z-index:2;padding:10px 8px;font-weight:700;border-bottom:1px solid var(--line);display:flex;gap:6px;align-items:center;height:44px}
.stili-k i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.wres{position:relative}
.wra-l{height:calc(var(--slot)*4);font-size:11px;color:var(--fg2);text-align:right;padding-right:6px;border-top:1px solid var(--line);transform:translateY(-1px)}
.keli{height:var(--slot);border-top:1px dashed rgba(20,16,11,.06);cursor:pointer}
.keli:nth-child(4n+1){border-top:1px solid var(--line)}
.keli:hover{background:rgba(122,90,18,.07)}
.keli.kleisto{background:repeating-linear-gradient(45deg,#eee6d8,#eee6d8 4px,#e4dccd 4px,#e4dccd 8px);cursor:default}
.rv{position:absolute;left:3px;right:3px;border-radius:10px;padding:4px 7px;font-size:12px;line-height:1.25;overflow:hidden;cursor:pointer;color:var(--cream);background:var(--c);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.rv b{display:block;font-size:13px}
.rv.aitima{background:repeating-linear-gradient(135deg,var(--c),var(--c) 8px,#00000022 8px,#00000022 12px);outline:2px dashed var(--ink)}
.rv.irthe{opacity:.55}.rv.den{background:#6b6158;text-decoration:line-through}
.rv .anam{position:absolute;left:0;right:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.18),rgba(255,255,255,.18) 3px,transparent 3px,transparent 7px)}
.kl{position:absolute;left:3px;right:3px;border-radius:8px;background:#cfc5b4;color:var(--ink);font-size:12px;padding:3px 7px;cursor:pointer}
.lista{display:grid;gap:8px}
.karta{background:#fff;border-radius:var(--r);padding:14px 16px;display:grid;gap:4px;box-shadow:0 1px 0 var(--line)}
.karta .meta{color:var(--fg2);font-size:13px}
.karta-k{border-left:4px solid var(--c)}
.mod{position:fixed;inset:0;background:rgba(10,8,6,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.mod-in{background:var(--cream);width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 20px 28px;display:grid;gap:14px}
@media (min-width:700px){.mod{align-items:center}.mod-in{border-radius:20px}}
.mod-kef{display:flex;justify-content:space-between;align-items:center}
.mod-kef h2{font-size:24px}
.x{min-width:44px;min-height:44px;border:0;background:none;font-size:26px;cursor:pointer}
label{display:grid;gap:4px;font-weight:600;font-size:14px}
input,select,textarea{min-height:46px;border:1px solid rgba(20,16,11,.25);border-radius:12px;padding:10px 12px;background:#fff;font-weight:400}
textarea{min-height:80px}
.dyo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tsips{display:flex;flex-wrap:wrap;gap:6px}
.tsips label{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--cream2);font-weight:500;min-height:40px;cursor:pointer}
.tsips input{min-height:auto}
.wres-lista{display:flex;flex-wrap:wrap;gap:6px}
.wres-lista button{min-height:40px;min-width:64px;border-radius:10px;border:0;background:#fff;cursor:pointer;font-weight:700}
.wres-lista button[aria-pressed=true]{background:var(--cu);color:var(--cream)}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:500}.check input{min-height:auto;width:20px;height:20px;margin-top:2px}
.minima{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:12px 18px;border-radius:999px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.keno{padding:24px;text-align:center;color:var(--fg2);background:#fff;border-radius:var(--r)}
.syndesi{max-width:380px;margin:12vh auto;display:grid;gap:14px;padding:28px;background:#fff;border-radius:20px}
.syndesi h1{font-style:italic;font-size:40px}
.an-plegma{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.an-k{background:#fff;border-radius:14px;overflow:hidden;cursor:pointer}
.an-k div{aspect-ratio:4/5;background:var(--cream2) center/cover}
.an-k p{margin:0;padding:8px 10px;font-size:13px}
.prev{display:flex;gap:8px;flex-wrap:wrap}.prev img{width:72px;height:90px;object-fit:cover;border-radius:8px}
.odigos{background:#efe1c9;border-radius:12px;padding:12px 14px;font-size:13px}
.evd{display:grid;gap:8px}
.evd-m{background:#fff;border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:120px 1fr;gap:8px;align-items:center;cursor:pointer}
.bara{height:10px;border-radius:5px;background:var(--cream2);overflow:hidden;display:flex}
.bara span{height:100%;background:var(--c)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<script>
var S = { token: localStorage.getItem('pinakas-token'), rolos: null, kat: null, imera: null, epilogi: 'imera' };
var $ = function (s, r) { return (r || document).querySelector(s); };
function h(t, a, c) { var e = document.createElement(t); if (a) Object.keys(a).forEach(function (k) { var v = a[k]; if (k === 'text') e.textContent = v; else if (k === 'html') e.innerHTML = v; else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), v); else if (v !== false && v != null) e.setAttribute(k, v); }); (c || []).forEach(function (x) { if (x) e.appendChild(typeof x === 'string' ? document.createTextNode(x) : x); }); return e; }
function run(fn) { var a = [].slice.call(arguments, 1); return new Promise(function (ok, no) { google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { if (/έληξε|Μπες ξανά/.test(e.message)) { localStorage.removeItem('pinakas-token'); S.token = null; syndesi(); } minima(e.message); no(e); })[fn].apply(null, a); }); }
function minima(t) { var m = h('div', { class: 'minima', role: 'status', text: t }); document.body.appendChild(m); setTimeout(function () { m.remove(); }, 3200); }
var IMERES = ['Κυριακή', 'Δευτέρα', 'Τρίτη', 'Τετάρτη', 'Πέμπτη', 'Παρασκευή', 'Σάββατο'];
function dt(i) { var p = i.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function iso(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function add(i, n) { var d = dt(i); d.setDate(d.getDate() + n); return iso(d); }
function mera(i) { var d = dt(i); return IMERES[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1); }
function lepta(x) { var p = String(x).split(':'); return +p[0] * 60 + (+p[1] || 0); }
function wra(m) { return ('0' + Math.floor(m / 60)).slice(-2) + ':' + ('0' + m % 60).slice(-2); }
function kom(id) { return S.kat.kommotes.filter(function (k) { return k.id === id; })[0] || { onoma: id, xroma: '#5a5146' }; }
function ypMap() { var m = {}; S.kat.omades.forEach(function (g) { g.ypiresies.forEach(function (y) { m[y.id] = y; }); }); return m; }
function ypOnomata(ids) { var m = ypMap(); return String(ids).split(',').map(function (i) { return m[i] ? m[i].onoma : i; }).join(' + '); }

/* ── σύνδεση ── */
function syndesi() {
  var app = $('#app'); app.innerHTML = '';
  var inp = h('input', { type: 'password', autocomplete: 'current-password', 'aria-label': 'Κωδικός' });
  var b = h('button', { class: 'btn', text: 'Είσοδος' });
  function mpes() { b.disabled = true; run('syndesi', inp.value).then(function (r) { b.disabled = false; if (!r.ok) return minima(r.minima); S.token = r.token; localStorage.setItem('pinakas-token', r.token); ksekina(); }); }
  b.onclick = mpes; inp.onkeydown = function (e) { if (e.key === 'Enter') mpes(); };
  app.appendChild(h('div', { class: 'syndesi' }, [h('h1', { text: 'Γιάννης' }), h('p', { text: 'Πίνακας κομμωτηρίου. Γράψε τον κωδικό σου.' }), inp, b]));
  inp.focus();
}

/* ── κέλυφος ── */
var KARTELES = [['imera', 'Ημέρα'], ['evdomada', 'Εβδομάδα'], ['aitimata', 'Αιτήματα'], ['pelates', 'Πελάτες'], ['anartiseis', 'Αναρτήσεις'], ['rythmiseis', 'Ρυθμίσεις']];
function ksekina() {
  run('p_arxika', S.token).then(function (r) {
    S.rolos = r.rolos; S.kat = r.katalogos; S.orario = r.orario; S.imera = S.imera || r.simera; S.simera = r.simera;
    var app = $('#app'); app.innerHTML = '';
    var kef = h('header', { class: 'kef' }, [h('div', {}, [h('h1', { text: 'Γιάννης' }), h('small', { text: S.rolos === 'idioktitis' ? 'Ιδιοκτήτης' : 'Συνεργάτης' })]), h('div', { class: 'xoros' }),
      h('button', { class: 'btn', text: '+ Ραντεβού', onclick: function () { neoRantevou({}); } }),
      h('button', { class: 'btn deyt', style: 'color:var(--cream);box-shadow:inset 0 0 0 1px rgba(241,236,226,.3)', text: 'Έξοδος', onclick: function () { localStorage.removeItem('pinakas-token'); S.token = null; syndesi(); } })]);
    var kart = h('nav', { class: 'kart', role: 'tablist' });
    KARTELES.forEach(function (k) {
      if (k[0] === 'rythmiseis' && S.rolos !== 'idioktitis') return;
      kart.appendChild(h('button', { role: 'tab', 'data-k': k[0], 'aria-selected': S.epilogi === k[0] ? 'true' : 'false', html: k[1] + (k[0] === 'aitimata' ? ' <span class="badge" id="badge" hidden></span>' : ''),
        onclick: function () { S.epilogi = k[0]; kart.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-selected', b.dataset.k === k[0] ? 'true' : 'false'); }); deixe(); } }));
    });
    app.appendChild(kef); app.appendChild(kart); app.appendChild(h('main', { id: 'kyrio' }));
    if (r.email < 15) minima('Προσοχή: απομένουν ' + r.email + ' email σήμερα.');
    deixe();
    clearInterval(S.timer); S.timer = setInterval(function () { if (!document.hidden && !$('.mod') && (S.epilogi === 'imera' || S.epilogi === 'aitimata')) deixe(true); }, 60000);
  });
}
function deixe(siopilo) { ({ imera: imeraView, evdomada: evdomadaView, aitimata: aitimataView, pelates: pelatesView, anartiseis: anartiseisView, rythmiseis: rythmiseisView })[S.epilogi](siopilo); }
function kyrio() { var m = $('#kyrio'); m.innerHTML = ''; return m; }
function badge(n) { var b = $('#badge'); if (!b) return; b.hidden = !n; b.textContent = n; }

/* ── Ημέρα ── */
function imeraView() {
  run('p_imeres', S.token, S.imera, 1).then(function (d) {
    badge(d.aitimata);
    var m = kyrio(), w = dt(S.imera).getDay() || 7;
    m.appendChild(h('div', { class: 'nav-im' }, [h('button', { 'aria-label': 'Προηγούμενη ημέρα', text: '‹', onclick: function () { S.imera = add(S.imera, -1); imeraView(); } }),
      h('h2', { text: mera(S.imera) + (S.imera === S.simera ? ' · σήμερα' : '') }),
      h('button', { 'aria-label': 'Επόμενη ημέρα', text: '›', onclick: function () { S.imera = add(S.imera, 1); imeraView(); } })]));
    var tools = h('div', { class: 'seira', style: 'margin-bottom:12px' }, [h('input', { type: 'date', value: S.imera, onchange: function (e) { if (e.target.value) { S.imera = e.target.value; imeraView(); } } }),
      h('button', { class: 'btn deyt', text: 'Σήμερα', onclick: function () { S.imera = S.simera; imeraView(); } }),
      h('button', { class: 'btn deyt', text: 'Κλείσιμο χρόνου', onclick: function () { kleisimo(); } })]);
    m.appendChild(tools);
    var kk = S.kat.kommotes, apo = 9 * 60, eos = 21 * 60;
    var pl = h('div', { class: 'plegma', style: '--k:' + kk.length });
    var wcol = h('div', {}, [h('div', { class: 'stili-k' })]); var wr = h('div', { class: 'wres' });
    for (var t = apo; t < eos; t += 60) wr.appendChild(h('div', { class: 'wra-l', text: wra(t) }));
    wcol.appendChild(wr); pl.appendChild(wcol);
    kk.forEach(function (k) {
      var col = h('div', { class: 'stili', style: '--c:' + k.xroma }, [h('div', { class: 'stili-k' }, [h('i'), k.onoma])]);
      var c = h('div', { class: 'wres' }), zones = (S.orario[k.id] || {})[w] || [];
      for (var t = apo; t < eos; t += 15) (function (t) {
        var anoixto = zones.some(function (z) { return t >= lepta(z[0]) && t < lepta(z[1]); });
        c.appendChild(h('div', { class: 'keli' + (anoixto ? '' : ' kleisto'), title: wra(t), onclick: anoixto ? function () { neoRantevou({ kommotis: k.id, imerominia: S.imera, ora: wra(t) }); } : null }));
      })(t);
      var slot = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--slot')) || 22;
      d.kleisimata.filter(function (x) { return x.kommotis === k.id || x.kommotis === 'oloi'; }).forEach(function (x) {
        var a = Math.max(apo, lepta(x.apo)), b = Math.min(eos, lepta(x.eos)); if (b <= a) return;
        c.appendChild(h('div', { class: 'kl', style: 'top:' + ((a - apo) / 15 * slot) + 'px;height:' + ((b - a) / 15 * slot - 2) + 'px', text: 'Κλειστό' + (x.logos ? ' · ' + x.logos : ''),
          onclick: function () { if (confirmBox('Διαγραφή κλεισίματος;')) run('p_sviseKleisimo', S.token, x.id).then(imeraView); } }));
      });
      d.rantevou.filter(function (r) { return r.kommotis === k.id && !/Ακυρώθηκε|Απορρίφθηκε/.test(r.katastasi); }).forEach(function (r) {
        var a = lepta(r.ora), b = lepta(r.lixi), el = h('div', { class: 'rv' + (r.katastasi === 'Αίτημα' ? ' aitima' : '') + (r.katastasi === 'Ήρθε' ? ' irthe' : '') + (r.katastasi === 'Δεν ήρθε' ? ' den' : ''),
          style: 'top:' + ((a - apo) / 15 * slot) + 'px;height:' + Math.max(slot, (b - a) / 15 * slot - 2) + 'px', onclick: function () { leptomereies(r); } },
          [h('b', { text: r.ora + ' ' + r.onoma }), h('span', { text: ypOnomata(r.ypiresies) })]);
        var t0 = 0; String(r.tmimata).split(',').forEach(function (s) { var dd = +s.trim().slice(1); if (/^[AΑ]/.test(s.trim())) el.appendChild(h('span', { class: 'anam', style: 'top:' + (t0 / 15 * slot) + 'px;height:' + (dd / 15 * slot) + 'px' })); t0 += dd; });
        c.appendChild(el);
      });
      col.appendChild(c); pl.appendChild(col);
    });
    m.appendChild(pl);
    var ak = d.rantevou.filter(function (r) { return /Ακυρώθηκε/.test(r.katastasi); });
    if (ak.length) m.appendChild(h('p', { class: 'meta', style: 'color:var(--fg2);margin-top:12px', text: 'Ακυρωμένα σήμερα: ' + ak.map(function (r) { return r.ora + ' ' + r.onoma; }).join(', ') }));
  });
}
function confirmBox(t) { return window.confirm(t); }

/* ── λεπτομέρειες ραντεβού ── */
function modal(titlos, soma) {
  var x = h('button', { class: 'x', 'aria-label': 'Κλείσιμο', text: '×' });
  var m = h('div', { class: 'mod', role: 'dialog', 'aria-modal': 'true' }, [h('div', { class: 'mod-in' }, [h('div', { class: 'mod-kef' }, [h('h2', { text: titlos }), x])].concat(soma))]);
  function kleise() { m.remove(); document.removeEventListener('keydown', esc); }
  function esc(e) { if (e.key === 'Escape') kleise(); }
  x.onclick = kleise; m.onclick = function (e) { if (e.target === m) kleise(); }; document.addEventListener('keydown', esc);
  document.body.appendChild(m); setTimeout(function () { var f = m.querySelector('input,select,textarea,button.btn'); if (f) f.focus(); }, 30);
  return kleise;
}
function leptomereies(r) {
  var kl;
  var b = function (t, k, cls) { return h('button', { class: 'btn ' + (cls || 'deyt'), text: t, onclick: function () { run('p_katastasi', S.token, r.id, k).then(function () { minima('Έγινε: ' + k); kl(); deixe(); }); } }); };
  var sim = h('textarea', { text: r.simeiosi || '' }); sim.value = r.simeiosi || '';
  kl = modal(r.onoma, [
    h('div', { class: 'karta' }, [h('b', { text: mera(r.imerominia) + ', ' + r.ora + '–' + r.lixi }), h('span', { text: ypOnomata(r.ypiresies) }),
      h('span', { class: 'meta', text: kom(r.kommotis).onoma + ' · ' + r.katastasi + ' · ' + r.pigi + (r.proti ? ' · πρώτη φορά' : '') }),
      h('span', {}, [h('a', { href: 'tel:' + r.kinito, text: r.kinito }), r.email ? ' · ' : '', r.email ? h('a', { href: 'mailto:' + r.email, text: r.email }) : null])]),
    h('label', {}, ['Σημείωση', sim]), h('button', { class: 'btn deyt', text: 'Αποθήκευση σημείωσης', onclick: function () { run('p_simeiosi', S.token, r.id, sim.value).then(function () { minima('Αποθηκεύτηκε'); }); } }),
    r.katastasi === 'Αίτημα' ? h('div', { class: 'seira' }, [b('Έγκριση', 'Επιβεβαιωμένο', ' '), b('Απόρριψη', 'Απορρίφθηκε', 'kindynos')]) :
      h('div', { class: 'seira' }, [b('Ήρθε', 'Ήρθε', ' '), b('Δεν ήρθε', 'Δεν ήρθε')]),
    h('div', { class: 'seira' }, [h('button', { class: 'btn deyt', text: 'Μετακίνηση', onclick: function () { kl(); metakinisi(r); } }),
      h('button', { class: 'btn kindynos', text: 'Ακύρωση', onclick: function () { if (confirmBox('Ακύρωση του ραντεβού; Ο πελάτης παίρνει email.')) run('p_katastasi', S.token, r.id, 'Ακυρώθηκε').then(function () { kl(); deixe(); }); } })])
  ]);
}

/* ── επιλογή ώρας (νέο / μετακίνηση) ── */
function epilogiWras(cont, ids, getKom, getImer, exairesi, onPick) {
  var l = h('div', { class: 'wres-lista' }), epivoli = h('input', { type: 'time', step: 900, 'aria-label': 'Άλλη ώρα (επιβολή)' });
  cont.appendChild(h('label', {}, ['Ελεύθερες ώρες', l]));
  cont.appendChild(h('label', {}, ['ή άλλη ώρα, εκτός διαθεσιμότητας (επιβολή)', epivoli]));
  epivoli.onchange = function () { l.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); }); onPick(epivoli.value, getKom(), true); };
  function fortose() {
    l.innerHTML = '<span class="meta">Ψάχνω…</span>';
